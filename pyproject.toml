[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pikaops"
version = "2.0.0"
description = "A Pikachu-themed DevOps CLI for System Monitoring"
readme = "walkthrough.md"
requires-python = ">=3.7"
dependencies = [
    "textual>=0.40.0",
    "psutil>=5.0.0",
    "httpx>=0.20.0"
]
authors = [
  {name = "Lance", email = "granjithkumar2004@gmail.com"},
]

[project.scripts]
pikaops = "main:main"

[tool.setuptools.packages.find]
include = ["tui*", "utils*"]
